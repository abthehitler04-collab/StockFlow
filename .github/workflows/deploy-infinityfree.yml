name: Deploy to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  validate-and-deploy:
    name: Validate & Deploy to InfinityFree FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        run: npm ci --if-present

      - name: Validate JavaScript and JSON files
        run: |
          node --check sw.js
          node -e "new Function(require('fs').readFileSync('google-apps-script/Code.gs', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('version.json'))"
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest'))"
          echo "All static validation checks passed."

      - name: Inject production config.json
        # Replace the placeholder config.json with production values from GitHub Secrets.
        # This ensures the APPS_SCRIPT_URL is never committed to source control.
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: |
          cat > config.json << EOF
          {
            "_comment": "Auto-generated by GitHub Actions deploy workflow. Do not edit manually.",
            "APPS_SCRIPT_URL": "${APPS_SCRIPT_URL}",
            "APP_VERSION": "2.0.0-centralized",
            "COMPANY_NAME": "StockFlow Enterprise",
            "CURRENCY_SYMBOL": "৳",
            "LOW_STOCK_THRESHOLD": 10,
            "ALLOW_NEGATIVE_STOCK": false,
            "AUTO_SYNC_INTERVAL_MS": 120000,
            "ENVIRONMENT": "production"
          }
          EOF
          echo "config.json generated with production APPS_SCRIPT_URL."

      - name: Run Phase-1 Acceptance Tests
        if: ${{ env.APPS_SCRIPT_URL != '' }}
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL || 'admin@stockflow.internal' }}
          TEST_ADMIN_PIN: ${{ secrets.TEST_ADMIN_PIN || '123456' }}
        run: |
          npm test 2>&1 | tee test-results.txt
          echo "Test suite completed."
        continue-on-error: true # Don't block deploy on test failure; review test-results.txt artifact

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.txt
          retention-days: 14

      - name: Deploy to InfinityFree via FTP
        # Upload only the production manifest; never mirror source, tests, or secrets.
        env:
          FTP_HOST: ${{ secrets.INFINITYFREE_FTP_HOST }}
          FTP_USER: ${{ secrets.INFINITYFREE_FTP_USER }}
          FTP_PASS: ${{ secrets.INFINITYFREE_FTP_PASS }}
          FTP_DIR: ${{ secrets.INFINITYFREE_FTP_DIR || '/amaya.10001mb.com/htdocs' }}
        run: |
          sudo apt-get install -y lftp
          lftp -u "${FTP_USER},${FTP_PASS}" "${FTP_HOST}" <<EOF
          set ftp:ssl-allow yes
          set ftp:ssl-force no
          set ftp:ssl-protect-data yes
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set net:timeout 30
          cd "${FTP_DIR}"
          mkdir -p google-apps-script
          mkdir -p badbin
          mkdir -p badbin/assets
          put index.html
          put sw.js
          put version.json
          put manifest.webmanifest
          put config.json
          put .htaccess
          put robots.txt
          put -O google-apps-script google-apps-script/Code.gs
          put -O google-apps-script google-apps-script/README-BACKEND-SETUP.md
          put -O badbin badbin/index.html
          put -O badbin badbin/.htaccess
          put -O badbin badbin/manifest.webmanifest
          put -O badbin badbin/robots.txt
          put -O badbin/assets badbin/assets/index-Final20260916.js
          put -O badbin/assets badbin/assets/index-CktYb_0n.css
          put -O badbin/assets badbin/assets/badbin-flow-atlas.webp
          put -O badbin/assets badbin/assets/badbin-paper-grain.webp
          put -O badbin/assets badbin/assets/badbin-route-mark.webp
          put -O badbin/assets badbin/assets/badbin-route-texture.webp
          bye
          EOF
          echo "Deployment to InfinityFree completed."

      - name: Smoke test deployed URL
        env:
          SITE_URL: ${{ secrets.INFINITYFREE_SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "INFINITYFREE_SITE_URL secret not set; skipping smoke test."
            exit 0
          fi
          # Allow a moment for files to propagate
          sleep 10
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "${SITE_URL}/" || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "Smoke test passed: ${SITE_URL}/ returned HTTP 200"
          else
            echo "WARNING: Smoke test got HTTP ${STATUS} for ${SITE_URL}/"
            exit 1
          fi
